[workspace]
name = "bd-massspec-bagel"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pandas = ">=2.2"
numpy = ">=1.26"
scipy = ">=1.13"
matplotlib = ">=3.8"
seaborn = ">=0.13"
scikit-learn = ">=1.4"
pytest = ">=9.1.1,<10"
biopython = ">=1.88,<2"

[tasks]
build-ordination-table = "python analysis/ordination/scripts/build_ordination_table.py"
pcoa-ordination = "python analysis/ordination/scripts/pcoa_ordination.py"
differential-features = "python analysis/differential_features/scripts/differential_features.py"
differential-features-primary = "python analysis/differential_features_primary/scripts/differential_features_primary.py"
feature-tables-primary = "python analysis/differential_features_primary/scripts/generate_feature_tables.py"
gbl-fetch-reference = "bash analysis/genome_bioactivity_linkage/scripts/fetch_reference_annotation.sh"
gbl-build-tables = "python analysis/genome_bioactivity_linkage/scripts/build_linkage_tables.py"
rna-expression-evidence = "python analysis/rnaseq_expression/scripts/build_expression_evidence.py"
usi-curation = "python analysis/differential_features_primary/scripts/build_usi_curation.py"
